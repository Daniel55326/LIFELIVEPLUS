<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1b1d"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="EZVIZ Demo">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><link rel="stylesheet" href="style.css">
<title>EZVIZ Web — demo</title>
</head>
<body><main class="app">
<section class="hero" aria-label="Ilustrație demonstrativă"><div class="scene">
<div class="moon"></div><div class="window"></div><div class="plant"><i></i><i></i><i></i><i></i></div>
<div class="bed"><div class="pillow"></div></div>
<svg class="wave" viewBox="0 0 900 260" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="ribbon" x1="0" x2="1"><stop offset="0" stop-color="#a97835"/><stop offset=".5" stop-color="#d47a45"/><stop offset="1" stop-color="#b84b4b"/></linearGradient></defs><path d="M-20 75 C130 180 180 190 300 130 S455 15 535 75 S650 220 760 220 S850 180 930 200" fill="none" stroke="url(#ribbon)" stroke-width="34" stroke-linecap="round"/></svg>
<div class="camera"><span></span><b></b></div></div>
<div class="brand"><div class="flower" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><span>EZVIZ</span></div></section>
<section class="login"><h1 class="page-title">Reautentificare — demo</h1>
<p class="intro">Demonstrație neoficială. Nu introduce parola contului tău EZVIZ.</p>
<form id="demoForm"><label class="field"><span class="mail-icon" aria-hidden="true">✉</span><input id="email" type="email" autocomplete="off" placeholder="Email demonstrativ (opțional)"></label>
<label class="field"><input id="testValue" type="text" autocomplete="off" placeholder="Notă de test (nu parolă)" maxlength="80"></label>
<button class="sign-in" type="submit">Trimite cod de test pe Telegram</button><p class="notice" id="notice" role="status"></p></form>
<nav class="bottom-links"><p>Codul este generat de server; câmpurile nu sunt trimise către Telegram.</p></nav></section>
<aside class="install" id="installTip"><strong>Adaugă pe ecranul principal</strong><p>În Safari apasă <span class="share">↑</span> Partajare, apoi <b>Add to Home Screen</b>.</p><button id="dismissInstall" type="button" aria-label="Închide">×</button></aside>
</main><script src="app.js"></script></body></html>
